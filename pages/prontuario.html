<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário do Paciente - SGHSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="imagex/png" href="../assets/img/hospital.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#" id="back-link">Voltar ao Painel</a>
            <button class="btn btn-danger" onclick="logoutUser()">Sair</button>
        </div>
    </nav>
    <div class="container mt-5">
        <h3 id="prontuario-title"></h3>
        
        <div id="doctor-form-area" class="card p-3 mb-4" style="display: none;">
            <h5>Adicionar Nova Nota ao Prontuário</h5>
            <form id="prontuario-form">
                <div class="mb-3">
                    <textarea id="entry-text" class="form-control" rows="3" required placeholder="Digite a evolução do paciente, observações ou plano de tratamento..."></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-info text-white">
                        <i class="bi bi-save me-1"></i>Salvar Nota
                    </button>
                    <button type="button" class="btn btn-primary" onclick="openReturnModal()">
                        <i class="bi bi-calendar-check me-1"></i>Agendar Retorno
                    </button>
                </div>
            </form>
        </div>

        <h4>Histórico de Atendimentos</h4>
        <div id="prontuario-list" class="list-group"></div>
    </div>
    <div class="modal fade" id="returnModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="returnModalTitle">Agendar Consulta de Retorno</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="return-form">
                <div class="mb-3">
                    <label for="return-specialty" class="form-label">Especialidade</label>
                    <input type="text" class="form-control" id="return-specialty" readonly disabled>
                </div>
                <div class="mb-3">
                    <label for="return-type" class="form-label">Tipo de Consulta</label>
                    <select class="form-select" id="return-type" required>
                        <option value="Presencial" selected>Presencial</option>
                        <option value="Telemedicina">Telemedicina</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="return-date" class="form-label">Data e Hora do Retorno</label>
                    <input type="datetime-local" class="form-control" id="return-date" required>
                </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="handleScheduleReturn()">Confirmar Agendamento</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        protectPage(['paciente', 'medico']);
        const currentUser = getCurrentUser();
        const allUsers = JSON.parse(localStorage.getItem('sghss_users')) || [];
        const urlParams = new URLSearchParams(window.location.search);
        const patientEmail = urlParams.get('paciente');
        const patient = allUsers.find(user => user.email === patientEmail);
        const patientName = patient ? patient.nome : patientEmail;

        const returnModal = new bootstrap.Modal(document.getElementById('returnModal'));

        document.getElementById('back-link').href = `dashboard-${currentUser.role}.html`;
        document.getElementById('prontuario-title').innerText = `Prontuário de: ${patientName}`;

        if (currentUser.role === 'medico') {
            document.getElementById('doctor-form-area').style.display = 'block';
        }

        function renderProntuario() {
            const prontuarioList = document.getElementById('prontuario-list');
            prontuarioList.innerHTML = '';
            const entries = getProntuario(patientEmail);
            if (entries.length === 0) {
                prontuarioList.innerHTML = '<div class="list-group-item"><p class="text-muted">Nenhum registro encontrado.</p></div>';
            } else {
                entries.forEach(entry => {
                    const author = allUsers.find(u => u.email === entry.doctor);
                    const authorName = author ? author.nome : entry.doctor;
                    const authorRole = author ? (author.role === 'medico' ? 'Dr(a).' : (author.role === 'enfermeiro' ? 'Enf.' : '')) : '';
                    prontuarioList.innerHTML += `<div class="list-group-item"><p class="mb-1">${entry.text}</p><small class="text-muted">Registrado por ${authorRole} ${authorName} em ${new Date(entry.date).toLocaleString('pt-BR')}</small></div>`;
                });
            }
        }
        
        document.getElementById('prontuario-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const entryText = document.getElementById('entry-text').value;
            if(entryText.trim() === '') return;
            saveProntuarioEntry(patientEmail, entryText);
            document.getElementById('entry-text').value = '';
            renderProntuario();
        });

        function openReturnModal() {
            document.getElementById('return-form').reset();
            document.getElementById('return-specialty').value = currentUser.specialty;
            
            const dateInput = document.getElementById('return-date');
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            dateInput.min = now.toISOString().slice(0, 16);

            returnModal.show();
        }

        function handleScheduleReturn() {
            const returnDate = document.getElementById('return-date').value;
            if (!returnDate) {
                alert("Por favor, selecione uma data e hora para o retorno.");
                return;
            }

            const appointmentData = {
                id: 'app' + Date.now(),
                patientEmail: patientEmail,
                specialty: currentUser.specialty,
                type: document.getElementById('return-type').value,
                date: returnDate,
                status: 'Pendente'
            };

            const result = saveAppointment(appointmentData);

            if (result === true) {
                const formattedDate = new Date(returnDate).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short'});
                saveProntuarioEntry(patientEmail, `Retorno agendado para ${formattedDate}.`);
                alert("Consulta de retorno agendada com sucesso!");
                returnModal.hide();
                renderProntuario();
            } else {
                alert(`Erro ao agendar: ${result}`);
            }
        }

        renderProntuario();
    </script>
</body>
</html>
